<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Finance Tracker</h1>

      <!-- Summary Bar -->
      <div class="summary-bar">
        <div class="summary-item">
          <p>Total Balance</p>
          <h2 id="total-balance">RM 0.00</h2>
        </div>
        <div class="summary-item income">
          <p>Total Income</p>
          <h2 id="total-income">RM 0.00</h2>
        </div>
        <div class="summary-item expense">
          <p>Total Expenses</p>
          <h2 id="total-expenses">RM 0.00</h2>
        </div>
      </div>

      <!-- Charts Section -->
      <div class="section">
        <div class="section-header">
          <h3>Analytics</h3>
        </div>
        <div class="charts-container">
          <div class="chart-box">
            <h4>Spending by Category</h4>
            <canvas id="category-chart"></canvas>
          </div>
          <div class="chart-box">
            <h4>Income vs Expenses (6 Months)</h4>
            <canvas id="monthly-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- Accounts Section -->
      <div class="section">
        <div class="section-header">
          <h3>Accounts</h3>
          <button onclick="toggleAddAccount()">+ Add Account</button>
        </div>

        <!-- Add Account Form (hidden by default) -->
        <div class="form-box" id="account-form" style="display: none">
          <input
            type="text"
            id="account-name"
            placeholder="Account Name (e.g. Maybank)"
          />
          <select id="account-type">
            <option value="Cash">Cash</option>
            <option value="Bank">Bank</option>
            <option value="Card">Card</option>
            <option value="Other">Other</option>
          </select>
          <input
            type="number"
            id="account-balance"
            placeholder="Opening Balance (e.g. 500)"
          />
          <button onclick="addAccount()">Save Account</button>
        </div>

        <!-- Accounts List -->
        <div id="accounts-list" class="accounts-list"></div>
      </div>

      <!-- Transactions Section -->
      <div class="section">
        <div class="section-header">
          <h3>Transactions</h3>
          <div id="pagination" class="month-nav"></div>
          <div style="display: flex; gap: 8px">
            <button onclick="toggleImport()">📥 Import</button>
            <button onclick="toggleAddTransaction()">+ Add Transaction</button>
            <button
              onclick="deleteAllTransactions()"
              style="background: #ef4444"
            >
              🗑️ Delete All
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
          <select id="filter-type" onchange="applyFilters()">
            <option value="">All Types</option>
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
            <option value="Transfer">Transfer</option>
          </select>
          <select id="filter-category" onchange="applyFilters()">
            <option value="">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
          <select id="filter-account" onchange="applyFilters()">
            <option value="">All Accounts</option>
          </select>
          <button onclick="clearFilters()">✕ Clear</button>
        </div>

        <!-- Import CSV -->
        <div class="form-box" id="import-form" style="display: none">
          <p style="margin-bottom: 10px; color: #888; font-size: 0.9rem">
            Import from your old expense tracker CSV
          </p>
          <input type="file" id="csvFile" accept=".csv" />
          <button onclick="importCSV()">Import</button>
          <div id="progress-container" style="display: none; margin-top: 15px">
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 6px;
              "
            >
              <span style="font-size: 0.85rem; color: #888">Importing...</span>
              <span
                id="progress-text"
                style="font-size: 0.85rem; color: #4f46e5"
                >0%</span
              >
            </div>
            <div
              style="background: #e0e0e0; border-radius: 999px; height: 10px"
            >
              <div
                id="progress-bar"
                style="
                  height: 10px;
                  width: 0%;
                  background: #4f46e5;
                  border-radius: 999px;
                  transition: width 0.2s;
                "
              ></div>
            </div>
            <p
              id="progress-detail"
              style="font-size: 0.8rem; color: #888; margin-top: 8px"
            >
              0 imported • 0 skipped
            </p>
          </div>
        </div>

        <!-- Add Transaction Form (hidden by default) -->
        <div class="form-box" id="transaction-form" style="display: none">
          <select id="transaction-type" onchange="handleTypeChange()">
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
            <option value="Transfer">Transfer</option>
          </select>

          <input type="number" id="transaction-amount" placeholder="Amount" />
          <input
            type="text"
            id="transaction-description"
            placeholder="Description (optional)"
          />
          <input type="datetime-local" id="transaction-date" />

          <!-- Category (hidden for Transfer) -->
          <select id="transaction-category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>

          <!-- Account (for Expense and Income) -->
          <select id="transaction-account">
            <!-- filled dynamically -->
          </select>

          <!-- From and To Account (for Transfer only, hidden by default) -->
          <select id="transaction-from-account" style="display: none">
            <!-- filled dynamically -->
          </select>
          <select id="transaction-to-account" style="display: none">
            <!-- filled dynamically -->
          </select>

          <button onclick="addTransaction()">Save Transaction</button>
        </div>

        <!-- Transactions List -->
        <ul id="transactions-list"></ul>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
